spring:
  application:
    name: multimodal-example
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  ai:
    model:
      image: dashscope
    dashscope:
      image:
        enabled: true
        model: ${DASHSCOPE_ILLUSTRATION_MODEL:qwen-image-3.0-pro}
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        model: ${DASHSCOPE_VISION_MODEL:qwen4-max}
        multi-model: true
        enable-thinking: false
        parallel-tool-calls: false
      audio:
        speech:
          model: ${DASHSCOPE_TTS_MODEL:qwen-audio-3.1-tts-plus}

example:
  multimodal:
    image-model: ${spring.ai.dashscope.image.model}
    artifact-directory: ${MULTIMODAL_ARTIFACT_DIRECTORY:${java.io.tmpdir}/saa-multimodal}
